<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Souhail Apprentissage</title>
<meta name="description" content="Mémoriser une sourate par jour et apprendre une chose chaque jour sur l'islam.">
<meta name="theme-color" content="#1c6a63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Souhail Apprentissage">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<style id="css">
:root{
  /* Layout : une colonne étroite (téléphone), onglets fixes en bas, cartes sobres ; l'arabe porte l'accent visuel. */
  --bg:#eaefec; --surface:#fafcfa; --ink:#15302d; --muted:#5a6e69; --line:#d3dcd6;
  --accent:#1c6a63; --accent-ink:#ffffff; --mark:#a8741a; --ok:#2c7a4c; --warn:#9a4f14; --warn-bg:#f6ead9;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-ar:"Amiri","Scheherazade New","Traditional Arabic","Geeza Pro",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1918; --surface:#162423; --ink:#e3ebe7; --muted:#93a7a2; --line:#293a38;
    --accent:#5bbfb2; --accent-ink:#082220; --mark:#d8a850; --ok:#72c492; --warn:#e3a468; --warn-bg:#2c2416;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1918; --surface:#162423; --ink:#e3ebe7; --muted:#93a7a2; --line:#293a38;
  --accent:#5bbfb2; --accent-ink:#082220; --mark:#d8a850; --ok:#72c492; --warn:#e3a468; --warn-bg:#2c2416;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
#app{max-width:640px;margin:0 auto;padding:20px 16px 96px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.65rem}
h2{font-size:1.2rem}
h3{font-size:1.02rem}
p{margin:0}
a{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.num{font-variant-numeric:tabular-nums}
.head{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:1.25rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;color:var(--muted);line-height:1.2;display:block}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
section{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.done{border-color:var(--ok)}
.surah-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ar{font-family:var(--f-ar);direction:rtl;font-size:2rem;line-height:1.3;color:var(--mark);white-space:nowrap}
.ar.sm{font-size:1.35rem}
.tr{font-family:var(--f-display);font-size:1.25rem;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.76rem;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:var(--ok)}
.chip.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.chip.acc{color:var(--accent);border-color:var(--accent)}
.sens{border-left:3px solid var(--mark);padding-left:10px;font-size:.95rem}
.btn{font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:12px 14px;cursor:pointer;min-height:46px;text-align:center}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:6px 10px;min-height:36px;font-size:.86rem;font-weight:500}
.btn.is-done{background:transparent;color:var(--ok);border-color:var(--ok)}
.btn.danger{border-color:var(--warn);color:var(--warn);background:transparent}
button:focus-visible,a:focus-visible,summary:focus-visible,select:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.rows{display:flex;flex-direction:column;gap:6px}
.row{font:inherit;color:inherit;text-align:left;display:flex;align-items:center;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;min-height:50px}
.row .box{flex:none;width:22px;height:22px;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center;font-size:14px;line-height:1;color:transparent}
.row[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.row[aria-pressed="true"] .row-main{color:var(--muted)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-main small{color:var(--muted);font-size:.8rem}
.row .ar{font-size:1.25rem}
.note{background:var(--warn-bg);border:1px solid var(--warn);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:.9rem}
.info{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:.9rem;color:var(--muted)}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details>summary{cursor:pointer;padding:10px 12px;list-style:none;display:flex;gap:10px;align-items:baseline}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";margin-left:auto;color:var(--muted);font-weight:600}
details[open]>summary::after{content:"–"}
.d-body{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px;font-size:.94rem}
.hn{font-family:var(--f-display);font-weight:600;color:var(--mark);min-width:1.8em;font-variant-numeric:tabular-nums}
ol.steps,ul.plain{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.sched{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:.94rem}
.sched dt{font-weight:600;white-space:nowrap;color:var(--accent)}
.sched dd{margin:0}
.plan-row{display:grid;grid-template-columns:2.2em 1fr auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.plan-row.done{border-left:4px solid var(--ok)}
.plan-row.next{border-left:4px solid var(--mark)}
.plan-row .n{font-family:var(--f-display);font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.plan-mid{min-width:0;display:flex;flex-direction:column;gap:3px}
.plan-name{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:42px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}
nav.tabs div{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:640px}
nav.tabs a{padding:13px 2px 15px;text-align:center;text-decoration:none;color:var(--muted);font-size:.78rem;font-weight:500;border-top:3px solid transparent}
nav.tabs a[aria-current="page"]{color:var(--accent);border-top-color:var(--accent);font-weight:600}
.sync{font-size:.8rem;color:var(--muted);text-align:center}
@media (max-width:380px){.stats{grid-template-columns:repeat(2,1fr)}.ar{font-size:1.7rem}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
.err{color:var(--warn)}
input[type=text]{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:46px;flex:1 1 160px;min-width:0}
input[type=text]:focus-visible{outline:3px solid var(--mark);outline-offset:1px}
.verse{text-align:center}
.verse .ar{white-space:normal;font-size:1.7rem}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;border:0;background:transparent;color:var(--muted);padding:10px;min-height:44px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.lb{display:grid;grid-template-columns:2em 1fr auto;gap:6px 10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.lb.me{border-left:4px solid var(--mark)}
.lb.hid{opacity:.75}
.lb .rk{font-family:var(--f-display);font-weight:600;font-size:1.25rem;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.lb .rk.top{color:var(--mark)}
.lb-mid{min-width:0;display:flex;flex-direction:column;gap:5px}
.lb-name{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.lb-mid small{font-size:.8rem}
.pts{text-align:center;min-width:3em}
.pts b{display:block;font-family:var(--f-display);font-size:1.35rem;line-height:1.1}
.pts span{font-size:.72rem;color:var(--muted)}
.lb .kick{grid-column:2/4;justify-self:end}
a.info{display:block;text-decoration:none;color:var(--ink)}
.join details{background:transparent}
.prof{display:flex;gap:12px;align-items:flex-start}
.prof-av{flex:none;width:72px;height:72px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line)}
.prof-av svg{width:100%;height:100%;display:block}
.bubble{position:relative;flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:.95rem;display:flex;flex-direction:column;gap:2px}
.bubble::before{content:"";position:absolute;left:-7px;top:26px;width:12px;height:12px;background:var(--surface);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.prof-name{font-size:.72rem;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.form{gap:8px}
.form label,.form .lbl{font-weight:600;font-size:.9rem;margin-top:4px}
input[type=email],input[type=password]{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:46px;width:100%}
input[type=email]:focus-visible,input[type=password]:focus-visible{outline:3px solid var(--mark);outline-offset:1px}
.form input[type=text]{width:100%;flex:none}
.seg.seg3{grid-template-columns:1fr 1fr .7fr}
.seg.seg3 button{font-size:.88rem;padding:10px 6px}
.choice{font:inherit;color:var(--ink);text-align:left;display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.choice span{font-size:.85rem;color:var(--muted)}
.choice.on{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.btn[disabled]{opacity:.6;cursor:wait}
</style>
</head>
<body>
<div id="app"><noscript>Cette page a besoin de JavaScript pour afficher le plan de mémorisation.</noscript></div>
<script src="supabase.js"></script>
<script id="app-js">
(function(){
"use strict";

/* ---------- Données : sourates 114 -> 67 (numérotation Hafs) ---------- */
var S=[
[114,"الناس","An-Nās","Les Hommes",6,"Demande de protection auprès d'Allah, Seigneur, Roi et Dieu des hommes, contre le tentateur furtif qui souffle le mal dans les poitrines, qu'il soit djinn ou humain. Avec Al-Falaq, elle forme les deux sourates protectrices (al-Mu'awwidhatayn)."],
[113,"الفلق","Al-Falaq","L'Aube naissante",5,"Refuge auprès du Seigneur de l'aube contre le mal de ce qu'Il a créé : l'obscurité quand elle s'étend, la sorcellerie (celles qui soufflent sur les nœuds) et l'envieux quand il envie."],
[112,"الإخلاص","Al-Ikhlāṣ","Le Monothéisme pur",4,"Résumé du tawḥīd : Allah est Unique, Il est aṣ-Ṣamad (Celui vers qui tout se tourne et qui n'a besoin de rien), Il n'a pas engendré et n'a pas été engendré, et nul ne Lui est égal. Le Prophète ﷺ a dit qu'elle équivaut au tiers du Coran (al-Bukhārī et Muslim)."],
[111,"المسد","Al-Masad","Les Fibres",5,"Sourate sur Abū Lahab, oncle du Prophète ﷺ et ennemi acharné du message, et sur sa femme qui attisait cette hostilité. Ni la richesse ni la parenté ne protègent celui qui combat la vérité."],
[110,"النصر","An-Naṣr","Le Secours",3,"Quand viennent le secours d'Allah et la victoire, et que les gens entrent en foule dans la religion, la réponse demandée est la glorification, la louange et la demande de pardon. Ibn 'Abbās y a compris l'annonce de la fin proche de la vie du Prophète ﷺ (al-Bukhārī)."],
[109,"الكافرون","Al-Kāfirūn","Les Mécréants",6,"Désaveu net du polythéisme : aucun compromis dans l'adoration. Elle se termine par la séparation claire des voies : « À vous votre religion, et à moi la mienne. »"],
[108,"الكوثر","Al-Kawthar","L'Abondance",3,"Allah a accordé au Prophète ﷺ al-Kawthar, un bien abondant dont un fleuve au Paradis. En retour : prier et sacrifier pour Allah seul. C'est son ennemi qui restera sans postérité ni mémoire."],
[107,"الماعون","Al-Mā'ūn","L'Ustensile",7,"Portrait de celui qui dément la Rétribution : il repousse l'orphelin et n'incite pas à nourrir le pauvre. Menace pour ceux qui négligent leur prière, agissent par ostentation et refusent même la petite aide."],
[106,"قريش","Quraysh","Quraysh",4,"Rappel aux Quraysh des bienfaits reçus : leurs voyages d'hiver et d'été, la nourriture et la sécurité. La conséquence attendue : adorer le Seigneur de cette Maison (la Ka'ba)."],
[105,"الفيل","Al-Fīl","L'Éléphant",5,"Récit de l'armée à l'éléphant venue détruire la Ka'ba, anéantie par des nuées d'oiseaux lançant des pierres d'argile. Allah protège Sa Maison et déjoue la ruse des puissants."],
[104,"الهمزة","Al-Humaza","Le Calomniateur",9,"Menace contre celui qui diffame et dénigre, amasse la fortune et la compte en croyant qu'elle le rendra éternel. Il sera jeté dans al-Ḥuṭama, le Feu d'Allah qui atteint les cœurs."],
[103,"العصر","Al-'Aṣr","Le Temps",3,"Serment par le temps : l'homme est en perdition, sauf ceux qui croient, accomplissent les bonnes œuvres, se recommandent mutuellement la vérité et se recommandent la patience."],
[102,"التكاثر","At-Takāthur","La Course aux richesses",8,"La rivalité dans l'accumulation distrait l'homme jusqu'à ce qu'il arrive aux tombes. Il verra alors la réalité avec certitude et sera interrogé sur les bienfaits reçus."],
[101,"القارعة","Al-Qāri'a","Le Fracas",11,"Le Jour où les hommes seront comme des papillons dispersés et les montagnes comme de la laine cardée. Celui dont la balance est lourde aura une vie agréable ; celui dont elle est légère, l'abîme d'un Feu ardent."],
[100,"العاديات","Al-'Ādiyāt","Les Coursiers",11,"Serment par les chevaux lancés au galop : l'homme est ingrat envers son Seigneur et très attaché aux biens. Il oublie que le contenu des tombes sera exhumé et celui des poitrines dévoilé."],
[99,"الزلزلة","Az-Zalzala","La Secousse",8,"La terre tremblera, rejettera ses fardeaux et rapportera ce qui s'est fait sur elle. Les gens verront leurs œuvres : un atome de bien sera vu, un atome de mal aussi."],
[98,"البينة","Al-Bayyina","La Preuve",8,"La preuve claire est venue : un Messager récitant des feuillets purifiés. Il n'avait été ordonné aux gens que d'adorer Allah avec sincérité, d'accomplir la prière et d'acquitter la zakāt. La sourate distingue ensuite les pires et les meilleures des créatures."],
[97,"القدر","Al-Qadr","La Destinée",5,"Le Coran a été descendu durant la nuit d'al-Qadr, meilleure que mille mois. Les anges et l'Esprit y descendent par la permission de leur Seigneur ; elle est paix jusqu'à l'aube."],
[96,"العلق","Al-'Alaq","L'Adhérence",19,"Ses cinq premiers versets sont la première révélation : « Lis, au nom de ton Seigneur qui a créé. » La suite décrit l'homme qui se rebelle dès qu'il se croit autosuffisant, et celui qui voulait empêcher le Prophète ﷺ de prier. Elle se clôt par : « Prosterne-toi et rapproche-toi » (verset de prosternation)."],
[95,"التين","At-Tīn","Le Figuier",8,"Serment par le figuier, l'olivier, le mont Sinaï et la cité sûre (La Mecque) : l'homme a été créé dans la plus belle forme, puis ramené au plus bas, sauf ceux qui croient et font le bien. Allah est le plus juste des juges."],
[94,"الشرح","Ash-Sharḥ","L'Ouverture",8,"Rappel des faveurs faites au Prophète ﷺ : poitrine ouverte, fardeau allégé, renommée élevée. Promesse répétée : avec la difficulté vient une facilité. Puis l'ordre de se consacrer à l'adoration et d'aspirer vers son Seigneur."],
[93,"الضحى","Aḍ-Ḍuḥā","Le Jour montant",11,"Réconfort au Prophète ﷺ après une pause de la révélation : ton Seigneur ne t'a ni abandonné ni détesté. Il t'a recueilli orphelin, guidé et enrichi. Donc : ne brime pas l'orphelin, ne repousse pas le demandeur et proclame le bienfait de ton Seigneur."],
[92,"الليل","Al-Layl","La Nuit",21,"Les efforts des hommes divergent. Celui qui donne, craint Allah et croit à la plus belle récompense sera facilité vers l'aisance ; l'avare qui se croit suffisant sera facilité vers la difficulté. Le Feu sera évité au pieux qui donne pour se purifier, ne cherchant que la Face de son Seigneur."],
[91,"الشمس","Ash-Shams","Le Soleil",15,"Longue série de serments (soleil, lune, jour, nuit, ciel, terre, âme) pour affirmer : a réussi celui qui purifie son âme, a échoué celui qui la corrompt. Exemple de Thamūd, détruits après avoir tué la chamelle."],
[90,"البلد","Al-Balad","La Cité",20,"L'homme a été créé dans l'effort et la peine. Il se vante de ses dépenses alors qu'Allah le voit. La voie difficile à gravir (al-'aqaba) : affranchir un esclave, nourrir un orphelin proche ou un pauvre un jour de famine, puis être de ceux qui croient et se recommandent la patience et la miséricorde."],
[89,"الفجر","Al-Fajr","L'Aube",30,"Après des serments, rappel du sort de 'Ād, Thamūd et Pharaon. L'homme se trompe en lisant l'aisance comme un honneur et la restriction comme une humiliation ; il néglige l'orphelin et le pauvre et aime avidement les biens. Le Jour venu, il regrettera. La sourate se termine par l'appel à l'âme apaisée."],
[88,"الغاشية","Al-Ghāshiya","L'Enveloppante",26,"Deux groupes au Jour qui enveloppe tout : des visages humiliés, exposés au Feu, et des visages épanouis, dans un Jardin élevé. Invitation à observer les chameaux, le ciel, les montagnes et la terre. Le Prophète ﷺ n'est qu'un rappeleur ; le retour et le compte reviennent à Allah."],
[87,"الأعلى","Al-A'lā","Le Très-Haut",19,"Glorifie le nom de ton Seigneur, le Très-Haut, qui crée, proportionne, détermine et guide. A réussi celui qui se purifie, mentionne son Seigneur et prie. Vous préférez la vie présente alors que l'au-delà est meilleur et plus durable : cela figure déjà dans les feuillets d'Ibrāhīm et de Mūsā."],
[86,"الطارق","Aṭ-Ṭāriq","L'Astre nocturne",17,"Serment par le ciel et l'astre perçant : chaque âme a un gardien. Que l'homme regarde de quoi il a été créé ; Celui qui l'a créé peut le ramener, le Jour où les secrets seront dévoilés. Le Coran est une parole décisive, pas une plaisanterie."],
[85,"البروج","Al-Burūj","Les Constellations",22,"Récit des gens du Fossé (Aṣḥāb al-Ukhdūd), qui brûlèrent des croyants pour leur seule foi en Allah. Menace pour ceux qui éprouvent les croyants sans se repentir. Allah est le Pardonneur, le Tout-Affectueux, Maître du Trône ; le Coran est glorieux, sur une Tablette préservée."],
[84,"الانشقاق","Al-Inshiqāq","La Déchirure",25,"Le ciel se fendra et la terre s'étendra, obéissant à leur Seigneur. L'homme avance péniblement vers Lui et Le rencontrera : compte facile pour celui qui reçoit son livre dans la droite, perdition pour celui qui le reçoit derrière le dos. Contient un verset de prosternation (v. 21)."],
[83,"المطففين","Al-Muṭaffifīn","Les Fraudeurs",36,"Malheur à ceux qui exigent la pleine mesure pour eux et la diminuent pour les autres. Le registre des pervers est dans Sijjīn, celui des pieux dans 'Illiyyūn. Ceux qui se moquaient des croyants ici-bas verront la situation s'inverser."],
[82,"الانفطار","Al-Infiṭār","La Rupture",19,"Quand le ciel se rompra et que les tombes seront bouleversées, chaque âme saura ce qu'elle a avancé et laissé. « Ô homme, qu'est-ce qui t'a trompé au sujet de ton Seigneur, le Généreux ? » De nobles anges scribes consignent tout ; ce Jour-là, nul ne pourra rien pour autrui."],
[81,"التكوير","At-Takwīr","L'Obscurcissement",29,"Série de signes de la fin : le soleil enroulé, les étoiles ternies, la fillette enterrée vivante interrogée sur son crime. Alors chaque âme saura ce qu'elle a présenté. Puis le serment que le Coran est transmis par un noble messager (Jibrīl) et qu'il est un rappel pour qui veut suivre la droiture."],
[80,"عبس","'Abasa","Il s'est renfrogné",42,"Reproche adressé au Prophète ﷺ pour s'être détourné d'un aveugle venu apprendre ('Abdullāh ibn Umm Maktūm) alors qu'il s'adressait à des notables. Puis : la noblesse du Rappel, l'ingratitude de l'homme, l'invitation à regarder sa nourriture, et le Jour où chacun fuira ses proches."],
[79,"النازعات","An-Nāzi'āt","Les Anges qui arrachent",46,"Serments par les anges qui retirent les âmes, puis affirmation de la Résurrection. Récit de Mūsā face à Pharaon, qui se prétendait seigneur suprême. Le Jour venu, celui qui a transgressé et préféré la vie d'ici-bas aura la Fournaise ; celui qui a craint son Seigneur et retenu son âme, le Paradis. La date de l'Heure n'appartient qu'à Allah."],
[78,"النبأ","An-Naba'","La Nouvelle",40,"La grande nouvelle sur laquelle ils divergent : la Résurrection. Signes de la puissance d'Allah (terre, montagnes, sommeil, nuit, jour, pluie), puis le Jour de la Décision : l'Enfer pour les transgresseurs, la réussite pour les pieux. Le négateur dira : « Si seulement j'étais poussière ! »"],
[77,"المرسلات","Al-Mursalāt","Les Envoyés",50,"Après des serments, annonce du Jour de la Décision, rythmée par le refrain « Malheur, ce jour-là, à ceux qui démentaient ». Rappels de la destruction des anciens peuples, de la création de l'homme et de la terre, puis sort des négateurs et des pieux."],
[76,"الإنسان","Al-Insān","L'Homme",31,"L'homme, créé d'une goutte mêlée pour être éprouvé, a reçu la guidée : reconnaissant ou ingrat. Portrait des vertueux (al-abrār) : ils tiennent leurs vœux et nourrissent le pauvre, l'orphelin et le captif pour la seule Face d'Allah. Description de leurs délices, puis ordre de patience, de rappel matin et soir et de prière de nuit."],
[75,"القيامة","Al-Qiyāma","La Résurrection",40,"Serment par le Jour de la Résurrection et par l'âme qui se blâme : Allah peut reconstituer l'homme jusqu'au bout des doigts. L'homme sera témoin contre lui-même. Des visages resplendiront en regardant leur Seigneur. Description de l'agonie ; l'homme ne sera pas laissé sans compte."],
[74,"المدثر","Al-Muddaththir","Le Revêtu d'un manteau",56,"« Lève-toi et avertis » : glorifier son Seigneur, se purifier, fuir l'idolâtrie, patienter. Portrait de l'opposant qui, après réflexion, qualifia le Coran de magie. Description de Saqar et de ses dix-neuf gardiens ; ses habitants avouent : nous ne priions pas et nous ne nourrissions pas le pauvre."],
[73,"المزمل","Al-Muzzammil","L'Enveloppé",20,"Ordre de la prière de nuit et de la récitation posée du Coran (tartīl), en préparation d'une parole lourde. Patience face aux négateurs, exemple de Pharaon. Le dernier verset, long, allège la prière de nuit : récitez ce qui vous est facile du Coran, accomplissez la prière, donnez la zakāt et demandez pardon."],
[72,"الجن","Al-Jinn","Les Djinns",28,"Un groupe de djinns écoute le Coran, y croit et rejette les fausses croyances. Les mosquées sont à Allah : n'invoquez personne avec Lui. Le Prophète ﷺ ne détient pour autrui ni mal ni guidée ; seul Allah connaît l'Invisible, qu'Il dévoile à qui Il agrée comme messager."],
[71,"نوح","Nūḥ","Noé",28,"La prédication de Nūḥ : nuit et jour, en public et en privé. Il appelle à demander pardon, promettant pluie, biens et enfants. Son peuple s'obstine et s'accroche à ses idoles, puis est noyé. La sourate se clôt par l'invocation de Nūḥ."],
[70,"المعارج","Al-Ma'ārij","Les Voies d'ascension",44,"Un châtiment inévitable, un Jour de cinquante mille ans ; « patiente d'une belle patience ». L'homme a été créé anxieux et impatient, sauf ceux qui prient : assidus à la prière, reconnaissant un droit au pauvre dans leurs biens, croyant au Jour, chastes, fidèles aux dépôts et aux témoignages."],
[69,"الحاقة","Al-Ḥāqqa","L'Inéluctable",52,"L'Inéluctable : destruction de Thamūd, de 'Ād et de Pharaon, puis le souffle dans la Trompe. Joie de celui qui reçoit son livre dans la droite, regrets de celui qui le reçoit dans la gauche. Serment final : le Coran n'est la parole ni d'un poète ni d'un devin, c'est une révélation du Seigneur des mondes."],
[68,"القلم","Al-Qalam","Le Calame",52,"Serment par le calame : le Prophète ﷺ n'est pas fou et il est d'un caractère éminent. Parabole des propriétaires du jardin qui voulaient en priver les pauvres. Puis l'ordre de patienter et de ne pas être comme l'homme au poisson (Yūnus)."],
[67,"الملك","Al-Mulk","La Royauté",30,"Béni soit Celui qui détient la royauté, qui a créé la mort et la vie pour éprouver qui agit le mieux. Perfection des cieux, regrets des gens du Feu (« si nous avions écouté ou raisonné »), récompense de ceux qui craignent leur Seigneur sans Le voir. Un hadith dit de cette sourate de trente versets qu'elle intercède pour celui qui la récite jusqu'à ce qu'il soit pardonné (Abū Dāwūd et at-Tirmidhī, qui le juge ḥasan)."]
];

/* ---------- Données : les 42 hadiths d'an-Nawawī ---------- */
/* g : s = dans al-Bukhārī et/ou Muslim ; h = jugé ḥasan/ṣaḥīḥ par le collecteur ; d = authenticité discutée ; f = jugé faible par plusieurs savants */
var H=[
{n:1,r:"'Umar ibn al-Khaṭṭāb",t:"Les actes ne valent que par les intentions, et chacun n'obtient que ce qu'il a eu l'intention de faire. Celui qui émigre pour Allah et Son Messager, son émigration est pour eux ; celui qui émigre pour un bien de ce monde ou pour épouser une femme, son émigration vaut ce pour quoi il a émigré.",s:"al-Bukhārī et Muslim",g:"s",a:"Avant le sabaq du matin, formuler dans ton cœur pour qui tu apprends."},
{n:2,r:"'Umar ibn al-Khaṭṭāb",t:"Hadith de Jibrīl : un homme inconnu interroge le Prophète ﷺ sur l'islam (les cinq piliers), la foi (croire en Allah, Ses anges, Ses Livres, Ses messagers, au Jour dernier et au destin, bon ou mauvais), l'excellence (adorer Allah comme si tu Le voyais) et les signes de l'Heure. « C'était Jibrīl, venu vous enseigner votre religion. »",s:"Muslim",g:"s",a:"Savoir réciter de tête les trois niveaux : islām, īmān, iḥsān."},
{n:3,r:"'Abdullāh ibn 'Umar",t:"L'islam est bâti sur cinq piliers : l'attestation qu'il n'y a de divinité digne d'adoration qu'Allah et que Muḥammad est Son Messager, l'accomplissement de la prière, l'acquittement de la zakāt, le pèlerinage à la Maison et le jeûne de Ramadan.",s:"al-Bukhārī et Muslim",g:"s",a:"Vérifier lequel des cinq est le plus fragile chez toi et le consolider en premier."},
{n:4,r:"'Abdullāh ibn Mas'ūd",t:"Les étapes de la création de l'être humain dans le ventre de sa mère, puis l'ange qui insuffle l'âme et inscrit quatre choses : sa subsistance, son terme, ses œuvres et s'il sera heureux ou malheureux. Une personne peut agir longtemps comme les gens du Paradis ou du Feu, puis finir sur l'inverse : les actes valent par leur fin.",s:"al-Bukhārī et Muslim",g:"s",a:"Ne pas se reposer sur ses acquis et demander à Allah une bonne fin."},
{n:5,r:"'Ā'isha",t:"Quiconque introduit dans notre religion ce qui n'en fait pas partie, cela est rejeté. Dans une version de Muslim : quiconque accomplit un acte non conforme à notre affaire, il est rejeté.",s:"al-Bukhārī et Muslim",g:"s",a:"Avant d'adopter une pratique cultuelle, demander sa preuve."},
{n:6,r:"An-Nu'mān ibn Bashīr",t:"Le licite est clair et l'illicite est clair ; entre les deux se trouvent des choses douteuses que beaucoup de gens ne connaissent pas. Celui qui s'en écarte préserve sa religion et son honneur. Il y a dans le corps un morceau de chair : s'il est sain, tout le corps est sain, et s'il est corrompu, tout le corps l'est. C'est le cœur.",s:"al-Bukhārī et Muslim",g:"s",a:"Dans le doute, s'abstenir ; soigner le cœur avant les apparences."},
{n:7,r:"Tamīm ad-Dārī",t:"La religion, c'est la sincérité loyale (an-naṣīḥa) : envers Allah, Son Livre, Son Messager, les dirigeants des musulmans et l'ensemble des musulmans.",s:"Muslim",g:"s",a:"Vouloir sincèrement le bien d'autrui, y compris quand le conseil coûte."},
{n:8,r:"'Abdullāh ibn 'Umar",t:"Le Prophète ﷺ dit avoir reçu l'ordre de combattre les gens jusqu'à ce qu'ils attestent l'unicité d'Allah et la mission de Muḥammad, accomplissent la prière et acquittent la zakāt ; cela fait, leur sang et leurs biens sont protégés, sauf droit de l'islam, et leur compte revient à Allah.",s:"al-Bukhārī et Muslim",g:"s",note:"Texte qui relève de l'autorité légitime et qui ne se comprend qu'avec les autres textes et les explications des savants. À lire avec le commentaire d'Ibn Rajab, pas isolément.",a:"On juge les gens sur l'apparent ; l'intérieur des cœurs appartient à Allah."},
{n:9,r:"Abū Hurayra",t:"Ce que je vous ai interdit, écartez-vous-en ; ce que je vous ai ordonné, accomplissez-en ce que vous pouvez. Ceux d'avant vous ont péri à cause de leurs questions excessives et de leurs divergences avec leurs prophètes.",s:"al-Bukhārī et Muslim",g:"s",a:"Les interdits s'évitent entièrement, les ordres se font selon la capacité."},
{n:10,r:"Abū Hurayra",t:"Allah est bon et n'accepte que ce qui est bon. Il a ordonné aux croyants ce qu'Il a ordonné aux messagers : manger du licite et faire le bien. Puis l'exemple de l'homme en long voyage, les mains levées vers le ciel, alors que sa nourriture, sa boisson et ses vêtements sont illicites : comment serait-il exaucé ?",s:"Muslim",g:"s",a:"Vérifier que ses revenus sont licites : cela conditionne l'exaucement des invocations."},
{n:11,r:"Al-Ḥasan ibn 'Alī",t:"Délaisse ce qui te fait douter pour ce qui ne te fait pas douter.",s:"at-Tirmidhī (qui le juge ḥasan ṣaḥīḥ) et an-Nasā'ī",g:"h",a:"Entre deux options, choisir celle qui laisse le cœur tranquille."},
{n:12,r:"Abū Hurayra",t:"Fait partie du bel islam d'une personne le fait de délaisser ce qui ne la regarde pas.",s:"at-Tirmidhī et d'autres",g:"d",note:"An-Nawawī le juge ḥasan. Ibn Rajab rapporte que plusieurs grands spécialistes considèrent que sa forme correcte est mursal (chaîne interrompue après le successeur 'Alī ibn al-Ḥusayn). Le sens est appuyé par d'autres textes.",a:"Couper ce qui ne te concerne ni pour ta religion ni pour ta vie : c'est aussi du temps gagné pour le Coran."},
{n:13,r:"Anas ibn Mālik",t:"Aucun de vous ne croit véritablement tant qu'il n'aime pas pour son frère ce qu'il aime pour lui-même.",s:"al-Bukhārī et Muslim",g:"s",a:"Se réjouir du bien qui arrive aux autres et le leur souhaiter."},
{n:14,r:"'Abdullāh ibn Mas'ūd",t:"Le sang d'un musulman est sacré. Il n'est licite que dans trois cas limitativement cités : la personne mariée coupable d'adultère, vie pour vie, et celui qui abandonne sa religion et se sépare de la communauté.",s:"al-Bukhārī et Muslim",g:"s",note:"Ces peines relèvent exclusivement d'une autorité judiciaire légitime, avec des conditions de preuve strictes ; jamais des individus. Voir le commentaire d'Ibn Rajab.",a:"Le principe de base : la vie humaine est inviolable."},
{n:15,r:"Abū Hurayra",t:"Que celui qui croit en Allah et au Jour dernier dise du bien ou se taise ; qu'il honore son voisin ; qu'il honore son hôte.",s:"al-Bukhārī et Muslim",g:"s",a:"Avant de parler ou d'écrire : est-ce un bien ? Sinon, silence."},
{n:16,r:"Abū Hurayra",t:"Un homme demanda un conseil au Prophète ﷺ. Il répondit : « Ne te mets pas en colère. » L'homme répéta sa demande plusieurs fois, et la réponse resta la même.",s:"al-Bukhārī",g:"s",a:"Repérer ses déclencheurs de colère et couper court (se taire, changer de position, faire ses ablutions)."},
{n:17,r:"Shaddād ibn Aws",t:"Allah a prescrit l'excellence (al-iḥsān) en toute chose. Même lors de l'abattage d'un animal : aiguiser sa lame et épargner la souffrance à la bête.",s:"Muslim",g:"s",a:"Faire bien ce que tu fais, y compris ton travail et ta récitation."},
{n:18,r:"Abū Dharr et Mu'ādh ibn Jabal",t:"Crains Allah où que tu sois, fais suivre la mauvaise action d'une bonne qui l'effacera, et comporte-toi avec les gens avec un bon caractère.",s:"at-Tirmidhī, qui le juge ḥasan (ḥasan ṣaḥīḥ selon certaines copies)",g:"h",a:"Après une faute : une bonne action tout de suite, sans attendre."},
{n:19,r:"'Abdullāh ibn 'Abbās",t:"« Jeune homme, préserve Allah, Il te préservera ; préserve Allah, tu Le trouveras devant toi. Quand tu demandes, demande à Allah ; quand tu cherches de l'aide, cherche-la auprès d'Allah. » Si toute la communauté se réunissait pour te profiter ou te nuire, elle ne le pourrait que par ce qu'Allah a écrit. Les calames sont levés et les feuillets ont séché.",s:"at-Tirmidhī, qui le juge ḥasan ṣaḥīḥ",g:"h",a:"Garder les ordres d'Allah ; Lui demander en premier, avant les gens."},
{n:20,r:"Abū Mas'ūd al-Badrī",t:"Parmi ce que les gens ont retenu des paroles des premiers prophètes : « Si tu n'as pas de pudeur, fais ce que tu veux. »",s:"al-Bukhārī",g:"s",a:"La pudeur (al-ḥayā') est un frein utile : s'en servir comme test avant d'agir."},
{n:21,r:"Sufyān ibn 'Abdillāh ath-Thaqafī",t:"« Dis-moi sur l'islam une parole après laquelle je n'aurai plus à interroger personne. » Réponse : « Dis : je crois en Allah, puis sois droit. »",s:"Muslim",g:"s",a:"La constance compte plus que l'intensité : petit volume, tous les jours."},
{n:22,r:"Jābir ibn 'Abdillāh",t:"Un homme demanda : si j'accomplis les prières obligatoires, jeûne Ramadan, tiens pour licite le licite et pour illicite l'illicite, sans rien ajouter, entrerai-je au Paradis ? Le Prophète ﷺ répondit : oui.",s:"Muslim",g:"s",a:"Les obligations d'abord ; le surérogatoire vient ensuite."},
{n:23,r:"Abū Mālik al-Ash'arī",t:"La purification est la moitié de la foi ; « al-ḥamdu lillāh » remplit la balance ; la prière est une lumière, l'aumône une preuve, la patience une clarté, et le Coran un argument pour toi ou contre toi. Chacun, chaque matin, engage son âme : il la libère ou la perd.",s:"Muslim",g:"s",a:"Le Coran mémorisé doit être appliqué pour plaider en ta faveur."},
{n:24,r:"Abū Dharr",t:"Hadith qudsī : « Ô Mes serviteurs, Je Me suis interdit l'injustice et Je l'ai rendue interdite entre vous : ne soyez pas injustes les uns envers les autres. » Vous êtes tous égarés sauf celui que Je guide, affamés sauf celui que Je nourris : demandez-Moi. Ce ne sont que vos œuvres que Je recense ; que celui qui trouve du bien loue Allah.",s:"Muslim",g:"s",a:"Demander la guidée chaque jour ; ne léser personne."},
{n:25,r:"Abū Dharr",t:"Des Compagnons pauvres se plaignent que les riches emportent les récompenses grâce à leurs aumônes. Le Prophète ﷺ répond que chaque tasbīḥ, takbīr, taḥmīd et tahlīl est une aumône, de même qu'ordonner le bien et interdire le mal, et même l'intimité licite entre époux.",s:"Muslim",g:"s",a:"Remplir les temps morts (trajet, attente) de dhikr : c'est une aumône gratuite."},
{n:26,r:"Abū Hurayra",t:"Chaque articulation du corps doit une aumône, chaque jour où le soleil se lève : juger équitablement entre deux personnes, aider quelqu'un avec sa monture, dire une bonne parole, chaque pas vers la prière, écarter du chemin ce qui gêne.",s:"al-Bukhārī et Muslim",g:"s",a:"Rendre un service concret par jour, même minime."},
{n:27,r:"An-Nawwās ibn Sam'ān, puis Wābiṣa ibn Ma'bad",t:"La piété (al-birr), c'est le bon caractère ; le péché, c'est ce qui te trouble intérieurement et que tu n'aimerais pas que les gens découvrent. Dans le récit de Wābiṣa : « Consulte ton cœur », même si les gens te donnent des avis.",s:"Muslim pour le récit d'an-Nawwās ; Aḥmad et ad-Dārimī pour celui de Wābiṣa",g:"d",note:"Le récit d'an-Nawwās est dans Muslim. Celui de Wābiṣa est jugé ḥasan par an-Nawawī, mais Ibn Rajab relève des faiblesses dans ses chaînes ; il est appuyé par le premier.",a:"Le malaise intérieur face à un acte est un signal à écouter."},
{n:28,r:"Al-'Irbāḍ ibn Sāriya",t:"Un sermon qui fit trembler les cœurs et couler les larmes : crainte d'Allah, écoute et obéissance aux dirigeants, puis : « Attachez-vous à ma sunna et à celle des califes bien guidés, tenez-la fermement, et gardez-vous des innovations dans la religion. »",s:"Abū Dāwūd et at-Tirmidhī, qui le juge ḥasan ṣaḥīḥ",g:"h",a:"En cas de divergence, revenir à la sunna et à la compréhension des Compagnons."},
{n:29,r:"Mu'ādh ibn Jabal",t:"« Indique-moi une œuvre qui me fasse entrer au Paradis. » Réponse : adorer Allah sans rien Lui associer et accomplir les piliers. Puis les portes du bien : le jeûne est un bouclier, l'aumône éteint le péché, la prière au cœur de la nuit. La tête de l'affaire est l'islam, son pilier la prière, son sommet le jihād. Et ce qui tient tout cela : « Retiens ta langue. »",s:"at-Tirmidhī, qui le juge ḥasan ṣaḥīḥ",g:"h",a:"Maîtriser sa langue : c'est elle qui fait le plus chuter."},
{n:30,r:"Abū Tha'laba al-Khushanī",t:"Allah a prescrit des obligations : ne les négligez pas. Il a fixé des limites : ne les dépassez pas. Il a interdit des choses : ne les transgressez pas. Et Il s'est tu sur des choses par miséricorde, non par oubli : ne les recherchez pas.",s:"ad-Dāraquṭnī et d'autres",g:"d",note:"Jugé ḥasan par an-Nawawī. Plusieurs spécialistes relèvent une interruption dans sa chaîne (Makḥūl n'aurait pas entendu d'Abū Tha'laba) et certains le jugent faible. Son sens est conforme à d'autres textes établis.",a:"Classer chaque sujet : obligation, limite, interdit, ou zone laissée libre."},
{n:31,r:"Sahl ibn Sa'd as-Sā'idī",t:"« Indique-moi une œuvre qui me fasse aimer d'Allah et des gens. » Réponse : détache-toi de ce bas monde, Allah t'aimera ; détache-toi de ce que possèdent les gens, les gens t'aimeront.",s:"Ibn Mājah et d'autres",g:"d",note:"Jugé ḥasan par an-Nawawī. Ibn Rajab conteste ce jugement : la chaîne d'Ibn Mājah comporte un narrateur très affaibli. Certains savants contemporains l'ont renforcé par d'autres voies. À citer avec cette réserve.",a:"Ne pas convoiter ce que les autres ont."},
{n:32,r:"Abū Sa'īd al-Khudrī",t:"Ni nuisance, ni nuisance en retour (lā ḍarar wa lā ḍirār).",s:"Ibn Mājah, ad-Dāraquṭnī ; Mālik dans al-Muwaṭṭa' sous forme mursal",g:"d",note:"Chaque chaîne prise seule comporte une faiblesse ; an-Nawawī le juge ḥasan par l'ensemble de ses voies, qui se renforcent. Les juristes en ont fait une règle de droit majeure.",a:"Ne nuire à personne, même pour répondre à un tort."},
{n:33,r:"'Abdullāh ibn 'Abbās",t:"Si l'on donnait aux gens sur leurs seules prétentions, certains réclameraient les biens et le sang d'autrui. Mais la preuve incombe au demandeur et le serment à celui qui nie.",s:"al-Bayhaqī et d'autres ; une partie se trouve dans al-Bukhārī et Muslim",g:"d",note:"Jugé ḥasan par an-Nawawī sous cette formulation. Le cœur du hadith (le serment incombe au défendeur) est dans les deux Ṣaḥīḥ.",a:"Ne pas accuser ni croire une accusation sans preuve."},
{n:34,r:"Abū Sa'īd al-Khudrī",t:"Que celui d'entre vous qui voit un mal le change par sa main ; s'il ne le peut pas, par sa langue ; s'il ne le peut pas, par son cœur, et c'est là le plus faible degré de la foi.",s:"Muslim",g:"s",a:"Au minimum, ne jamais approuver le mal intérieurement ; agir selon sa capacité et sa responsabilité."},
{n:35,r:"Abū Hurayra",t:"Ne vous enviez pas, ne faites pas monter les prix par tromperie, ne vous détestez pas, ne vous tournez pas le dos. Soyez, serviteurs d'Allah, des frères. Le musulman ne lèse pas son frère, ne l'abandonne pas, ne le méprise pas. « La piété est ici », dit-il en désignant sa poitrine. Tout du musulman est sacré pour le musulman : son sang, ses biens et son honneur.",s:"Muslim",g:"s",a:"Mépriser quelqu'un suffit comme mal : surveiller ce réflexe."},
{n:36,r:"Abū Hurayra",t:"Celui qui soulage un croyant d'une peine, Allah le soulagera d'une peine au Jour dernier ; celui qui facilite, Allah lui facilitera ; celui qui couvre un musulman, Allah le couvrira. Celui qui emprunte un chemin pour chercher la science, Allah lui facilite un chemin vers le Paradis. Celui que ses œuvres ralentissent, sa lignée ne le fera pas avancer.",s:"Muslim",g:"s",a:"Ta leçon quotidienne est littéralement ce « chemin vers la science »."},
{n:37,r:"'Abdullāh ibn 'Abbās",t:"Hadith qudsī : Allah a inscrit les bonnes et les mauvaises actions. Une bonne action projetée mais non faite compte pour une bonne action complète ; faite, elle compte de dix à sept cents fois, et plus encore. Une mauvaise action projetée puis délaissée compte pour une bonne action ; commise, elle ne compte que pour une seule.",s:"al-Bukhārī et Muslim",g:"s",a:"Multiplier les intentions sincères de bien, et renoncer à une faute pour Allah."},

/* ---------- État personnel ---------- */
var DEF={v:2,ts:0,start:"2026-11-17",cap:20,known:{},prog:{},rev:{},had:{},adv:null};
var LSC="souhail-apprentissage-cache";
var DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
function lsGet(k){try{var t=localStorage.getItem(k);return t?JSON.parse(t):null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
function isObj(o){return !!o&&typeof o==="object"&&!Array.isArray(o);}
/* Normalise un état (le sien ou celui d'un autre participant : données partagées = non fiables). */
function norm(src){
  src=isObj(src)?src:{};
  var o={v:2,ts:+src.ts||0,start:DATE_RE.test(src.start)?src.start:DEF.start,cap:[10,15,20,25].indexOf(+src.cap)>=0?+src.cap:20,known:{},prog:{},rev:{},had:{},adv:DATE_RE.test(src.adv)?src.adv:null};
  if(isObj(src.known))Object.keys(src.known).forEach(function(n){if(src.known[n]&&SI[n]!==undefined)o.known[n]=1;});
  if(isObj(src.prog))Object.keys(src.prog).forEach(function(n){var a=src.prog[n];if(SI[n]===undefined||!Array.isArray(a))return;
    var b=a.filter(function(c){return Array.isArray(c)&&typeof c[0]==="number"&&DATE_RE.test(c[1]);}).map(function(c){return [c[0],c[1]];});if(b.length)o.prog[n]=b;});
  if(isObj(src.rev))Object.keys(src.rev).forEach(function(d){var a=src.rev[d];if(!DATE_RE.test(d)||!Array.isArray(a))return;
    var b=a.filter(function(n){return typeof n==="number"&&SI[n]!==undefined;});if(b.length)o.rev[d]=b;});
  if(isObj(src.had))Object.keys(src.had).forEach(function(n){var d=src.had[n];if(DATE_RE.test(d)&&+n>=1&&+n<=42)o.had[n]=d;});
  return o;
}

/* ---------- Dates ---------- */
function pad(n){return n<10?"0"+n:""+n;}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2],12);}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d);}
function diff(a,b){return Math.round((parse(a)-parse(b))/864e5);}
function today(){return iso(new Date());}
function fmt(s,long){try{return parse(s).toLocaleDateString("fr-FR",long?{weekday:"long",day:"numeric",month:"long"}:{weekday:"short",day:"numeric",month:"short"});}catch(e){return s;}}

/* ---------- Plan ---------- */
function buildPlan(cap){
  var eff=Math.round(cap*1.25),out=[];
  S.forEach(function(s){
    var n=s[4],parts=Math.max(1,Math.ceil(n/eff)),base=Math.floor(n/parts),rem=n%parts,from=1;
    for(var p=0;p<parts;p++){var len=base+(p<rem?1:0);out.push({num:s[0],from:from,to:from+len-1,part:p+1,parts:parts,phase:s[0]>=78?1:2});from+=len;}
  });
  return out;
}

function weekStart(t){var d=parse(t);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d);}

function compute(st){
  st=st||state;
  function cp(n){return st.prog[n]||[];}
  function kn(n){return !!st.known[n];}
  function dd(l){var d=null;cp(l.num).forEach(function(c){if(c[0]>=l.to&&(d===null||c[1]<d))d=c[1];});return d;}
  var t=today(),plan=buildPlan(st.cap),next=null,doneToday=[],nDone=0,nTotal=0;
  plan.forEach(function(l,i){
    l.i=i;l.known=kn(l.num);l.date=l.known?null:dd(l);
    if(!l.known){nTotal++;if(l.date){nDone++;if(l.date===t)doneToday.push(l);}else if(!next)next=l;}
  });
  var d=doneToday.length?addDays(t,1):(t>st.start?t:st.start),end={1:null,2:null};
  plan.forEach(function(l){if(!l.known&&!l.date){l.proj=d;end[l.phase]=d;d=addDays(d,1);}});
  /* révisions */
  var lastRev={};Object.keys(st.rev).forEach(function(dt){if(dt<t)(st.rev[dt]||[]).forEach(function(n){if(!lastRev[n]||lastRev[n]<dt)lastRev[n]=dt;});});
  var sabqi=[],pool=[],memV=0,memS=0,appV=0,appS=0,knownS=0;
  S.forEach(function(s,idx){
    var num=s[0];
    if(kn(num)){memV+=s[4];memS++;knownS++;pool.push({num:num,to:s[4],lr:lastRev[num]||"0000",idx:idx,known:true});return;}
    var all=0,to=0,last=null;
    cp(num).forEach(function(c){if(c[0]>all)all=c[0];if(c[1]<t){if(c[0]>to)to=c[0];if(!last||c[1]>last)last=c[1];}});
    var v=Math.min(all,s[4]);memV+=v;appV+=v;if(all>=s[4]){memS++;appS++;}
    if(!to)return;
    var it={num:num,to:Math.min(to,s[4]),last:last,idx:idx};
    if(diff(t,last)<=7)sabqi.push(it);else{it.lr=lastRev[num]||last;pool.push(it);}
  });
  sabqi.sort(function(a,b){return a.last<b.last?1:a.last>b.last?-1:a.idx-b.idx;});
  pool.sort(function(a,b){return a.lr<b.lr?-1:a.lr>b.lr?1:a.idx-b.idx;});
  var tot=0;pool.forEach(function(p){tot+=p.to;});
  var budget=Math.max(40,Math.ceil(tot/7)),sum=0,manzil=[];
  for(var j=0;j<pool.length;j++){if(sum>=budget)break;manzil.push(pool[j]);sum+=pool[j].to;}
  /* série et dernière activité */
  var act={};Object.keys(st.prog).forEach(function(n){cp(n).forEach(function(c){act[c[1]]=1;});});
  Object.keys(st.rev).forEach(function(dt){if((st.rev[dt]||[]).length)act[dt]=1;});
  Object.keys(st.had).forEach(function(n){act[st.had[n]]=1;});
  var streak=0,c=act[t]?t:addDays(t,-1);while(act[c]){streak++;c=addDays(c,-1);}
  var lastAct=null;Object.keys(act).forEach(function(k){if(k<=t&&(!lastAct||k>lastAct))lastAct=k;});
  var hRead=Object.keys(st.had).length,hToday=null,hNext=null;
  H.forEach(function(h){if(st.had[h.n]===t&&!hToday)hToday=h;if(!st.had[h.n]&&!hNext)hNext=h;});
  return {t:t,plan:plan,next:next,doneToday:doneToday,nDone:nDone,nTotal:nTotal,end:end,sabqi:sabqi,manzil:manzil,poolV:tot,budget:budget,memV:memV,memS:memS,appV:appV,appS:appS,knownS:knownS,lastAct:lastAct,streak:streak,hRead:hRead,hToday:hToday,hNext:hNext};
}

/* ---------- Classement ---------- */
/* Points : leçon (sabaq) validée 10, révision cochée 2, hadith lu 3. Les sourates « déjà sues » ne comptent pas. */
function statsFor(st,from){
  var C=compute(st),t=C.t,les=0,rev=0,had=0;
  function inP(d){return d<=t&&(!from||d>=from);}
  Object.keys(st.prog).forEach(function(n){(st.prog[n]||[]).forEach(function(c){if(inP(c[1]))les++;});});
  Object.keys(st.rev).forEach(function(d){if(inP(d))rev+=(st.rev[d]||[]).length;});
  Object.keys(st.had).forEach(function(n){if(inP(st.had[n]))had++;});
  return {pts:les*10+rev*2+had*3,les:les,rev:rev,had:had,streak:C.streak,appS:C.appS,appV:C.appV,knownS:C.knownS,lastAct:C.lastAct};
}
function ranking(period){
  var from=period==="all"?null:weekStart(today()),out=[],seen={};
  Object.keys(G.players).forEach(function(k){
    var p=G.players[k],mine=G.me&&k===G.key,hid=mine?G.hidden:p.hidden;
    if(hid&&!mine)return;
    var s;try{s=statsFor(mine?state:p.state,from);}catch(e){return;}
    seen[k]=1;out.push({k:k,name:mine?G.name:p.name,hidden:hid,mine:mine,s:s});
  });
  if(G.me&&G.key&&!seen[G.key])out.push({k:G.key,name:G.name,hidden:G.hidden,mine:true,s:statsFor(state,from)});
  out.sort(function(a,b){return b.s.pts-a.s.pts||b.s.streak-a.s.streak||String(a.name).localeCompare(String(b.name),"fr");});
  var r=0;out.forEach(function(x){if(!x.hidden){r++;x.rank=r;}});
  return out;
}

function profCard(C){
  var name=G.me&&G.name?G.name:"",todayRev=state.rev[C.t]||[];
  var left=C.sabqi.concat(C.manzil).filter(function(it){return todayRev.indexOf(it.num)<0;}).length;
  var sabaqDone=C.doneToday.length>0,hDone=!!C.hToday,hi="As-salāmu 'alaykum"+(name?" "+name:"")+".",msg;
  if(!C.next&&!sabaqDone)msg=hi+" Les deux juz' sont terminés, mā shā' Allāh. Passe à une demi-page par jour et garde tes révisions chaque jour.";
  else if(sabaqDone&&!left&&hDone)msg="Mā shā' Allāh"+(name?" "+name:"")+", ta journée est complète. Qu'Allah l'accepte. Ce soir, lis une fois le sabaq de demain.";
  else if(!sabaqDone){var s=su(C.next.num);msg=hi+" Aujourd'hui, on apprend "+s[2]+" ("+range(C.next)+"). Écoute-la d'abord, comprends son sens, puis apprends verset par verset."+(left?" Et n'oublie pas tes "+plural(left,"révision")+".":"");}
  else{var p=[];if(left)p.push(plural(left,"révision"));if(!hDone)p.push("la leçon du jour");msg="Sabaq validé, bien joué"+(name?" "+name:"")+". Il te reste "+p.join(" et ")+".";}

}

  [1,2].forEach(function(ph){
    h+='<section><h2>'+(ph===1?"Phase 1 · Juz' 'Amma (30)":"Phase 2 · Juz' Tabārak (29)")+'</h2><div class="rows">';

function viewMethod(C){
  var h='<header class="head"><span class="eyebrow">45 à 60 minutes par jour, en quatre créneaux</span><h1>Méthode</h1></header>';
  h+='<div class="note"><b>Ce qui est réaliste.</b> Une sourate par jour tient pour les sourates courtes du Juz\' \'Amma. Elle ne tient pas pour les longues : Al-Baqara compte 286 versets. Le vrai goulot n\'est pas d\'apprendre, c\'est de réviser : sans révision quotidienne, ce qui est appris en une semaine est perdu en un mois. Ce système plafonne donc le nouveau à environ '+state.cap+' versets par jour et rend la révision non négociable.</div>';
  h+='<section><h2>Ta journée type</h2><div class="card"><dl class="sched">'+
    '<dt>Après Fajr</dt><dd><b>Sabaq</b>, 20 à 30 min, tête reposée. C\'est le seul créneau à protéger absolument.</dd>'+
    '<dt>Prières du jour</dt><dd>Réciter le sabaq du matin dans les prières (sunna et obligatoires) : révision intégrée, sans temps en plus.</dd>'+

    '<dt>Trajets</dt><dd>Écouter le sabaq du jour ou celui du lendemain (transports, marche). Pas d\'écouteurs à vélo ni au volant.</dd>'+
    '<dt>Soir</dt><dd><b>Manzil</b>, 10 à 15 min, puis la leçon du jour (5 min). Ensuite le temps libre.</dd>'+
    '<dt>Avant de dormir</dt><dd>Lire une fois, en regardant le texte, le sabaq du lendemain.</dd></dl>'+
    '<p class="small muted">Jour de repos : réciter d\'une traite tout ce qui a été appris dans la semaine, à voix haute, devant quelqu\'un ou en t\'enregistrant.</p></div></section>';
  h+='<section><h2>Le sabaq en 5 étapes</h2><div class="card"><ol class="steps">'+
    '<li><b>Écouter</b> la portion 3 à 5 fois par un récitateur lent et précis (par exemple al-Ḥuṣarī, version d\'enseignement), en suivant le texte des yeux.</li>'+
    '<li><b>Comprendre</b> : lire le sens (résumé de la page Aujourd\'hui, puis traduction ou tafsīr).</li>'+
    '<li><b>Mémoriser verset par verset</b> : lire le verset 5 à 10 fois en regardant, puis le dire sans regarder jusqu\'à zéro erreur.</li>'+
    '<li><b>Enchaîner</b> : après chaque nouveau verset, reprendre depuis le premier (1 ; 1-2 ; 1-2-3…).</li>'+
    '<li><b>Valider</b> : réciter toute la portion 5 fois de suite de mémoire sans faute. Une erreur remet le compteur à zéro.</li></ol>'+
    '<p class="small muted">Garde toujours le même muṣḥaf (même édition, même mise en page) : la mémoire visuelle de la page aide beaucoup.</p></div></section>';

    '<li><b>Sabaq</b> : la leçon du jour.</li>'+
    '<li><b>Sabqī</b> : tout ce qui a été appris dans les 7 derniers jours, récité chaque jour. Chaque leçon est donc revue à J+1, J+2… jusqu\'à J+7.</li>'+
    '<li><b>Manzil</b> : tout ce qui est plus ancien, découpé pour repasser en entier en 7 jours au plus. La page choisit chaque jour ce qui n\'a pas été revu depuis le plus longtemps.</li></ul>'+
    '<p><b>Règle de priorité.</b> Un jour chargé, on garde la révision et on saute le sabaq, jamais l\'inverse. Si une sourate ancienne accroche, reprends-la comme un sabaq avant d\'avancer.</p></div></section>';
  h+='<section><h2>Fajr et les 7 heures de sommeil</h2><div class="card"><p>En hiver, Fajr est tard : se coucher vers 23 h suffit et le sabaq se fait juste après la prière. À partir du printemps, Fajr avance beaucoup (bien avant 5 h en juin) : dormir en deux temps (coucher tôt, prière, sabaq, puis une courte reprise de sommeil) ou déplacer le sabaq juste avant le départ au travail. Mieux vaut un sabaq court bien dormi qu\'un sabaq long épuisé.</p></div></section>';
  h+='<section><h2>Après ces deux juz\'</h2><div class="card"><p>À partir du Juz\' 28, les sourates sont trop longues pour le rythme « une par jour ». Passe à une quantité fixe : une demi-page par jour du muṣḥaf de Médine (15 lignes par page), une page si la révision suit. Ordre de grandeur honnête : il reste environ 560 pages, soit à peu près 3 ans à une demi-page par jour et 1 an et demi à une page, hors jours de pause. Le manzil grossit avec le stock : compte 20 à 30 minutes de révision par jour à mi-parcours, davantage ensuite.</p></div></section>';
  h+='<section><h2>Deux limites à connaître</h2><div class="card"><ul class="plain">'+
    '<li><b>La prononciation.</b> Apprendre seul à l\'oreille fixe facilement des erreurs de tajwīd, très dures à corriger ensuite. Fais-toi écouter régulièrement par quelqu\'un de compétent (mosquée, enseignant, cours en ligne), au moins une fois par semaine.</li>'+
    '<li><b>Le contenu de cette page.</b> Les résumés de sourates et de hadiths ont été rédigés par une IA (Claude), avec soin mais sans validation par un savant. Ils servent de point d\'entrée ; la référence reste le tafsīr et les ouvrages cités. Si tu ne connais pas encore Al-Fātiḥa parfaitement, commence par elle.</li></ul></div></section>';
  return h;
}

function viewLessons(C){

  });
  h+='</div>';
  h+='<section><h2>Après le 42e jour</h2><div class="card"><ol class="steps"><li><b>Les 8 hadiths ajoutés par Ibn Rajab</b> dans Jāmi\' al-\'Ulūm wal-Ḥikam, qui portent le total à 50.</li><li><b>Al-Uṣūl ath-Thalātha</b> (Les Trois Fondements) : un court texte de croyance, à lire un passage par jour avec une explication reconnue.</li><li><b>Riyāḍ aṣ-Ṣāliḥīn</b> d\'an-Nawawī : un chapitre par jour, sur le comportement et l\'adoration.</li></ol><p class="small muted">Ces cycles ne sont pas détaillés ici pour ne rien reproduire de mémoire sans vérification. Prends une édition imprimée avec les références des hadiths.</p></div></section>';
  return h;
}

var TABS_ALL=[["aujourdhui","Aujourd'hui",viewToday],["plan","Plan",viewPlan],["groupe","Groupe",viewGroup],["methode","Méthode",viewMethod],["lecons","Leçons",viewLessons]];
var syncState="idle";
function tabs(){return TABS_ALL.filter(function(t){return t[0]!=="groupe"||G.inRanking;});}
function curTab(){var T=tabs(),hsh=(location.hash||"").replace("#","");for(var i=0;i<T.length;i++)if(T[i][0]===hsh)return T[i];return T[0];}
function inApp(){return G.mode==="ready"||G.mode==="offline";}
function render(){
  var app=document.getElementById("app");
  if(!inApp()){app.innerHTML=authView();return;}
  var C=compute(),T=tabs(),tab=curTab(),h=tab[2](C);
  h+='<p class="sync" id="sync" role="status">'+syncHtml()+'</p>';
  h+='<nav class="tabs" aria-label="Sections"><div style="grid-template-columns:repeat('+T.length+',1fr)">'+T.map(function(t){return '<a href="#'+t[0]+'"'+(t===tab?' aria-current="page"':'')+'>'+t[1]+'</a>';}).join("")+'</div></nav>';
  app.innerHTML=h;
}
function setSync(s){syncState=s;var el=document.getElementById("sync");if(el)el.textContent=syncHtml();}
var pendingRender=false;
function typing(){var ae=document.activeElement;return !!ae&&ae.tagName==="INPUT";}
function safeRender(){if(typing()){pendingRender=true;return;}render();}

/* ---------- Connexion à Supabase ---------- */
var CFG={url:"https://utsdppdxtdktblscxqwc.supabase.co",key:"sb_publishable_t36Ehg6wqbY-M-h3Yo8f7A_p75_uMbb"};
var sb=null,wTimer=null,writing=false,wDirty=false,retryTimer=null;
var isRecovery=/type=recovery/.test(String(location.hash)+String(location.search));
function configured(){return CFG.url.indexOf("__")<0&&CFG.key.indexOf("__")<0;}
function siteUrl(){return location.origin+location.pathname;}
function frErr(e){
  var m=String((e&&(e.message||e.error_description))||e||"");
  if(/invalid login credentials/i.test(m))return "E-mail ou mot de passe incorrect.";
  if(/already registered|already been registered|user_already_exists/i.test(m))return "Un compte existe déjà avec cet e-mail : connecte-toi.";
  if(/password should be|at least 6|weak_password/i.test(m))return "Mot de passe trop court : 6 caractères minimum.";
  if(/email not confirmed/i.test(m))return "Confirme d'abord ton adresse avec le lien reçu par e-mail.";
  if(/rate limit|too many|over_email_send_rate/i.test(m))return "Trop de tentatives. Réessaie dans quelques minutes.";
  if(/invalid.*email|email.*invalid|validate email/i.test(m))return "Adresse e-mail invalide.";
  if(/failed to fetch|network|load failed/i.test(m))return "Pas de connexion internet. Réessaie.";
  return "Erreur : "+m;
}
function resetUser(){
  clearTimeout(wTimer);wDirty=false;writing=false;
  G.uid=null;G.key=null;G.email="";G.me=false;G.name="";G.inRanking=true;G.players={};G.loaded=false;G.err="";G.rename=null;
  state=norm({});
}
function boot(){
  if(!configured()||!window.supabase||typeof window.supabase.createClient!=="function"){G.mode="config";render();return;}
  sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange(function(ev,session){
    if(ev==="PASSWORD_RECOVERY"){isRecovery=true;G.mode="newpass";G.err="";render();}
    else if(ev==="SIGNED_OUT"){resetUser();G.mode="auth";render();}
  });
  sb.auth.getSession().then(function(r){
    var s=r&&r.data&&r.data.session;
    if(s&&s.user){if(isRecovery){G.mode="newpass";render();}else signedIn(s.user);}
    else{G.mode="auth";render();}
  },function(){G.mode="auth";render();});
}
function signedIn(user){
  G.uid=user.id;G.key=user.id;G.email=user.email||"";G.err="";G.info="";
  var c=lsGet(LSC);
  if(isObj(c)&&c.uid===G.uid){state=norm(c.state);G.name=cleanName(c.name);G.inRanking=c.inRanking!==false;G.cached=true;}
  else{state=norm({});G.cached=false;}
  G.mode="loading";render();
  loadOwn(true);
}
/* Lit son propre profil. first : à la connexion ; sinon, rafraîchissement (autre appareil). */
function loadOwn(first){
  if(!sb||!G.uid)return;
  sb.from("profiles").select("id,name,in_ranking,state,ts").eq("id",G.uid).maybeSingle().then(function(r){
    if(r.error){
      if(first){
        if(G.cached&&G.name){G.me=true;G.mode="offline";render();scheduleRetry();}
        else{G.mode="auth";G.err=frErr(r.error);render();}
      }
      return;
    }
    var d=r.data;
    if(!d){if(first||G.me){G.me=false;G.mode="join";if(!G.f.jname&&G.name)G.f.jname=G.name;render();}return;}
    G.me=true;G.name=cleanName(d.name);G.inRanking=!!d.in_ranking;
    var remote=norm(d.state);remote.ts=+d.ts||remote.ts;
    if(first){
      if(G.cached&&state.ts>remote.ts){wDirty=true;schedule(0);}  /* coches faites hors connexion sur cet appareil */
      else state=remote;
    }else if(!wDirty&&!writing&&remote.ts>state.ts)state=remote;
    if(G.mode!=="ready"){G.mode="ready";if(syncState==="loading"||syncState==="offline")setSync("idle");}
    cacheSave();
    if(G.inRanking)fetchPlayers();else{G.players={};G.loaded=true;}
    safeRender();
  },function(){if(first){if(G.cached&&G.name){G.me=true;G.mode="offline";render();scheduleRetry();}else{G.mode="auth";G.err="Pas de connexion internet. Réessaie.";render();}}});
}
function scheduleRetry(){clearTimeout(retryTimer);retryTimer=setTimeout(function(){if(G.mode==="offline")loadOwn(false);if(wDirty)flushW();},20000);}
function fetchPlayers(){
  if(!sb||!G.uid||!G.inRanking)return;
  sb.from("profiles").select("id,name,in_ranking,state,ts").eq("in_ranking",true).limit(300).then(function(r){
    G.loaded=true;
    if(r.error){G.subErr=true;safeRender();return;}
    var m={};
    (r.data||[]).forEach(function(x){if(!x||!x.id)return;m[x.id]={id:x.id,name:cleanName(x.name),hidden:false,ts:+x.ts||0,state:norm(x.state)};});
    G.players=m;G.subErr=false;safeRender();
  },function(){G.loaded=true;G.subErr=true;safeRender();});
}

/* ---------- Enregistrement ---------- */
function schedule(ms){clearTimeout(wTimer);wTimer=setTimeout(flushW,ms==null?1200:ms);}
function flushW(){
  clearTimeout(wTimer);
  if(!wDirty||writing||!sb||!G.uid||!G.me)return;
  writing=true;wDirty=false;setSync("saving");
  var body={state:state,ts:state.ts,name:G.name,in_ranking:G.inRanking,updated_at:new Date().toISOString()};
  function fail(e){
    writing=false;wDirty=true;
    var m=String((e&&(e.message||e.code))||"");
    if(/duplicate|unique|23505/i.test(m)&&G.prevName){G.err="Ce nom est déjà utilisé par quelqu'un d'autre.";G.name=G.prevName;G.prevName="";render();schedule(500);return;}
    setSync(/fetch|network|load failed/i.test(m)||navigator.onLine===false?"offline":"error");scheduleRetry();
  }
  sb.from("profiles").update(body).eq("id",G.uid).then(function(r){
    if(r.error)return fail(r.error);
    writing=false;G.prevName="";
    if(G.mode==="offline"){G.mode="ready";render();}
    setSync("saved");if(wDirty)flushW();
  },fail);
}
function commit(){
  state.ts=Date.now();cacheSave();render();
  if(G.me){wDirty=true;setSync("pending");schedule();}
}

/* ---------- Formulaires ---------- */
function onForm(name){
  if(G.busy||!sb)return;
  var email=String(G.f.email||"").trim(),pw=String(G.f.password||"");
  G.err="";G.info="";
  if(name==="login"||name==="signup"){
    if(!email||!pw){G.err="Remplis l'e-mail et le mot de passe.";render();return;}
    G.busy=true;render();
    var p=name==="login"?sb.auth.signInWithPassword({email:email,password:pw}):sb.auth.signUp({email:email,password:pw,options:{emailRedirectTo:siteUrl()}});
    p.then(function(r){
      G.busy=false;
      if(r.error){G.err=frErr(r.error);render();return;}
      var s=r.data&&r.data.session,u=r.data&&r.data.user;
      if(s&&u){G.f.password="";signedIn(u);}
      else{G.authTab="login";G.info="Compte créé. Ouvre l'e-mail de confirmation que tu viens de recevoir, clique sur le lien, puis reviens te connecter ici.";render();}
    },function(e){G.busy=false;G.err=frErr(e);render();});
  }else if(name==="forgot"){
    if(!email){G.err="Indique ton e-mail.";render();return;}
    G.busy=true;render();
    sb.auth.resetPasswordForEmail(email,{redirectTo:siteUrl()}).then(function(r){
      G.busy=false;if(r&&r.error){G.err=frErr(r.error);}else{G.info="Si un compte existe avec cet e-mail, un lien pour changer le mot de passe vient d'être envoyé.";}render();
    },function(e){G.busy=false;G.err=frErr(e);render();});
  }else if(name==="newpass"){
    var np=String(G.f.npass||"");
    if(np.length<6){G.err="6 caractères minimum.";render();return;}
    G.busy=true;render();
    sb.auth.updateUser({password:np}).then(function(r){
      G.busy=false;
      if(r.error){G.err=frErr(r.error);render();return;}
      isRecovery=false;G.f.npass="";
      try{history.replaceState(null,"",siteUrl());}catch(e){}
      signedIn(r.data.user);
    },function(e){G.busy=false;G.err=frErr(e);render();});
  }else if(name==="join"){
    var nm=cleanName(G.f.jname),code=String(G.f.jcode||"").trim(),rk=G.f.rank!=="solo";
    if(!nm){G.err="Choisis un nom à afficher.";render();return;}
    if(!code){G.err="Entre le code d'invitation.";render();return;}
    G.busy=true;render();
    if(!state.ts)state.ts=Date.now();
    if(!G.cached)state.start=todayIso()<DEF.start?DEF.start:todayIso();
    sb.rpc("join_group",{p_name:nm,p_code:code,p_ranking:rk,p_state:state}).then(function(r){
      G.busy=false;
      if(r.error){var m=String(r.error.message||"")+" "+String(r.error.code||"");
        G.err=/bad_code/.test(m)?"Code d'invitation incorrect.":/duplicate|unique|23505/.test(m)?"Ce nom est déjà utilisé : choisis-en un autre.":frErr(r.error);render();return;}
      G.cached=false;loadOwn(true);
    },function(e){G.busy=false;G.err=frErr(e);render();});
  }
}

/* ---------- Actions ---------- */
var PROGRESS_ACTS=["sabaq","adv","rev","had","known","reset"];
function onAct(el){
  var a=el.getAttribute("data-act"),t=today(),n=+el.getAttribute("data-n");
  if(PROGRESS_ACTS.indexOf(a)>=0&&!inApp())return;
  if(a!=="reset"&&resetArm)resetArm=false;
  if(a==="sabaq"){
    var C=compute(),l=C.plan[+el.getAttribute("data-i")];if(!l)return;
    if(l.date){if(l.date!==t)return;state.prog[l.num]=cps(l.num).filter(function(c){return c[0]<l.from;});if(!state.prog[l.num].length)delete state.prog[l.num];}
    else{var arr=cps(l.num).slice();arr.push([l.to,t]);state.prog[l.num]=arr;}
    state.adv=null;commit();
  }else if(a==="adv"){state.adv=t;commit();
  }else if(a==="rev"){var arr2=(state.rev[t]||[]).slice(),ix=arr2.indexOf(n);if(ix>=0)arr2.splice(ix,1);else arr2.push(n);if(arr2.length)state.rev[t]=arr2;else delete state.rev[t];
    var ks=Object.keys(state.rev).sort();while(ks.length>400)delete state.rev[ks.shift()];commit();
  }else if(a==="had"){if(state.had[n])delete state.had[n];else state.had[n]=t;commit();
  }else if(a==="known"){if(state.known[n])delete state.known[n];else state.known[n]=1;commit();
  }else if(a==="reset"){
    if(!resetArm){resetArm=true;render();return;}
    resetArm=false;var keep={start:state.start,cap:state.cap};state=norm({});state.start=keep.start;state.cap=keep.cap;commit();
  }else if(a==="period"){G.period=el.getAttribute("data-p")==="all"?"all":"week";render();
  }else if(a==="rank"){
    if(!G.me)return;G.inRanking=!G.inRanking;
    if(G.inRanking){G.loaded=false;fetchPlayers();}
    commit();
  }else if(a==="rename"){
    if(!G.me)return;
    var nm=cleanName(G.rename!==null?G.rename:G.name);
    if(!nm||nameTaken(nm,G.key)){G.err=nm?"Ce nom est déjà utilisé dans le groupe.":"Le nom ne peut pas être vide.";render();return;}
    G.err="";if(nm!==G.name){G.prevName=G.name;G.name=nm;}G.rename=null;commit();
  }else if(a==="logout"){if(wDirty)flushW();if(sb)sb.auth.signOut().then(null,function(){});resetUser();G.authTab="login";G.mode="auth";try{history.replaceState(null,"",siteUrl());}catch(e){}render();
  }else if(a==="atab"){G.authTab=el.getAttribute("data-t")||"login";G.err="";G.info="";render();
  }else if(a==="jrank"){G.f.rank=el.getAttribute("data-v")==="solo"?"solo":"group";render();
  }
}
var app=document.getElementById("app");
app.addEventListener("click",function(ev){var el=ev.target.closest?ev.target.closest("button[data-act]"):null;if(el){ev.preventDefault();onAct(el);}});
app.addEventListener("submit",function(ev){ev.preventDefault();var f=ev.target;if(f&&f.getAttribute)onForm(f.getAttribute("data-form"));});
app.addEventListener("change",function(ev){var el=ev.target;if(el&&el.id==="cap"&&inApp()){state.cap=+el.value||20;commit();}});
app.addEventListener("input",function(ev){var el=ev.target;if(!el||!el.id)return;if(el.id==="rename")G.rename=el.value;else G.f[el.id]=el.value;});
app.addEventListener("keydown",function(ev){var el=ev.target;if(ev.key==="Enter"&&el&&el.id==="rename"){ev.preventDefault();var b=document.querySelector('button[data-act="rename"]');if(b)onAct(b);}});
app.addEventListener("focusout",function(){if(pendingRender)setTimeout(function(){if(pendingRender&&!typing()){pendingRender=false;render();}},400);});
app.addEventListener("toggle",function(ev){var d=ev.target;if(d&&d.getAttribute&&d.getAttribute("data-h")){if(d.open)openH[d.getAttribute("data-h")]=1;else delete openH[d.getAttribute("data-h")];}},true);
window.addEventListener("hashchange",function(){if(!inApp())return;resetArm=false;render();window.scrollTo(0,0);});
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="hidden"){if(wDirty)flushW();}
  else if(inApp()){loadOwn(false);if(G.inRanking)fetchPlayers();}
});
window.addEventListener("online",function(){if(G.mode==="offline")loadOwn(false);if(wDirty)flushW();});
setInterval(function(){if(document.visibilityState!=="hidden"&&G.mode==="ready"&&G.inRanking)fetchPlayers();},60000);

render();
boot();
})();
